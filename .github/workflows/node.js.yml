name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret-key-for-ci
      DATABASE_URL: "file:./dev.db"
    
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: |
        cd server
        npm ci

    - name: Check Code Formatting
      run: |
        cd server
        npm run format:check

    - name: Run Linter
      run: |
        cd server
        npm run lint

    - name: Generate Prisma Client
      run: |
        cd server
        npx prisma generate

    - name: Run tests
      run: |
        cd server
        npm test

  client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      run: |
        cd client
        npm ci

    - name: Check Code Formatting
      run: |
        cd client
        npm run format:check

    - name: Run Linter
      run: |
        cd client
        npm run lint

    - name: Run tests
      run: |
        cd client
        npm test

    - name: Build
      run: |
        cd client
        npm run build
